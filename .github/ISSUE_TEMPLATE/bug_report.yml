name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** attach private documents. Security problems go through SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Browser extension
        - Windows app
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version, or the commit you built from
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Brave 1.x on Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a 120-page PDF
        2. Press Ctrl+F and search for "..."
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Error messages, screenshots, or the browser console output help a lot
    validations:
      required: true
