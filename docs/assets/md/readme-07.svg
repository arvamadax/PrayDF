<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 267" width="1280" height="267" role="img" aria-label="How it works: The extension watches for tabs that receive a PDF and opens them in its own viewer, the way Chrome&#x27;s PDF viewer does. From there, Open in app hands the file to the Windows app through a praydf: link. The app checks every link before it opens anything."><style>@font-face{font-family:"Inter";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"JetBrains Mono";src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Inter";font-weight:600 700;src:url(data:font/woff2;base64,) format("woff2")}text{font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0}</style><rect width="1280" height="267" rx="24" fill="#f8f8fc"/><rect x=".5" y=".5" width="1279" height="266" rx="24" fill="none" stroke="#e2e3ee"/><g font-family="Inter, Helvetica, Arial, sans-serif"><text x="56" y="93" font-size="40" font-weight="600" fill="#1e1b3a">How it works</text><text x="56" y="149" font-size="22" font-weight="400" fill="#1e1b3a">The extension watches for tabs that receive a PDF and opens them in its own viewer, the way Chrome's PDF</text><text x="56" y="184" font-size="22" font-weight="400" fill="#1e1b3a">viewer does. From there, <tspan font-weight="700">Open</tspan><tspan font-weight="700"> </tspan><tspan font-weight="700">in</tspan><tspan font-weight="700"> </tspan><tspan font-weight="700">app</tspan> hands the file to the Windows app through a <tspan font-family="JetBrains Mono, ui-monospace, monospace" font-size="19.8" fill="#4338ca">praydf:</tspan> link. The app</text><text x="56" y="219" font-size="22" font-weight="400" fill="#1e1b3a">checks every link before it opens anything.</text></g></svg>