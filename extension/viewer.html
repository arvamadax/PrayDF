<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrayDF</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="viewer.css">
  <script type="module" src="viewer.js"></script>
</head>
<body>
  <!-- Icons: Material Icons (Apache-2.0) -->
  <header class="bar">
    <div class="left">
      <button id="sideBtn" class="icon" aria-label="Tampilkan thumbnail" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <span id="name" class="name">PrayDF</span>
    </div>

    <div id="pdfTools" class="center" hidden>
      <input id="pageInput" class="page-input" inputmode="numeric" autocomplete="off" aria-label="Nomor halaman">
      <span id="pageCount" class="muted"></span>
      <span class="sep" aria-hidden="true"></span>
      <button id="zoomOut" class="icon" aria-label="Perkecil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13H5v-2h14v2z"/></svg>
      </button>
      <span id="zoom" class="zoom" aria-live="polite"></span>
      <button id="zoomIn" class="icon" aria-label="Perbesar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button id="fit" class="icon" aria-label="Pas satu halaman">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5c0-1.1-.9-2-2-2z"/></svg>
      </button>
      <button id="rotate" class="icon" aria-label="Putar searah jarum jam">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.55 5.55L11 1v3.07C7.06 4.56 4 7.92 4 12s3.05 7.44 7 7.93v-2.02c-2.84-.48-5-2.94-5-5.91s2.16-5.43 5-5.91V10l4.55-4.45zM19.93 11c-.17-1.39-.72-2.73-1.62-3.89l-1.42 1.42c.54.75.88 1.6 1.02 2.47h2.02zM13 17.9v2.02c1.39-.17 2.74-.71 3.9-1.61l-1.44-1.44c-.75.54-1.59.89-2.46 1.03zm3.89-2.42l1.42 1.41c.9-1.16 1.45-2.5 1.62-3.89h-2.02c-.14.87-.48 1.72-1.02 2.48z"/></svg>
      </button>
    </div>

    <div class="right">
      <button id="searchBtn" class="icon" aria-label="Cari di dokumen (Ctrl+F)" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <label for="picker" class="icon" role="button" tabindex="0" aria-label="Buka file">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
      </label>
      <button id="openApp" class="icon" aria-label="Buka di aplikasi PrayDF" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
      </button>
      <button id="download" class="icon" aria-label="Unduh" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </button>
      <button id="print" class="icon" aria-label="Cetak" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
      </button>
    </div>
  </header>

  <div id="findbar" class="findbar" role="search" hidden>
    <input id="findInput" type="search" placeholder="Cari di dokumen" aria-label="Cari di dokumen" autocomplete="off">
    <span id="findCount" class="muted" aria-live="polite"></span>
    <button id="findPrev" class="icon" aria-label="Hasil sebelumnya">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
    </button>
    <button id="findNext" class="icon" aria-label="Hasil berikutnya">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
    </button>
    <button id="findClose" class="icon" aria-label="Tutup pencarian">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <nav id="sidebar" class="thumbs" aria-label="Thumbnail halaman" hidden></nav>

  <main id="stage" class="stage">
    <div class="empty">
      <p class="empty-title">Seret file ke sini untuk membukanya</p>
      <p class="muted">PDF, DOCX, TXT, MD, CSV, JSON, dan gambar. Semua dibuka di perangkat ini, tidak diunggah.</p>
      <label for="picker" class="btn" role="button" tabindex="0">Pilih file</label>
    </div>
  </main>

  <div id="printArea" class="print-area"></div>
  <input id="picker" type="file" hidden
    accept=".pdf,.docx,.txt,.md,.csv,.json,.log,.xml,.html,.png,.jpg,.jpeg,.gif,.webp,.svg">
</body>
</html>
